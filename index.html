<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Kenko Life — Free Diet Chart</title>
<style>
  :root{ --green:#0d6b3a; --cream:#f4efe6; --text:#122; --border:#d9d9e3; }
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{ margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
        background:var(--cream); color:var(--text); line-height:1.35; }
  .viewport{ height:100vh; max-width:420px; margin:0 auto; display:flex; flex-direction:column;
             padding:10px 10px calc(env(safe-area-inset-bottom) + 10px); overflow:hidden; }
  .brand{ display:flex; justify-content:center; align-items:center; padding:4px 0 6px; }
  .brand img{ width:110px; height:auto; display:block }
  .card{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:10px;
         box-shadow:0 6px 18px rgba(16,24,40,.06); flex:1; display:flex; flex-direction:column; min-height:0; }
  .row3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; flex-wrap:wrap; }
  label{ font-size:12px; font-weight:700; display:block; margin-bottom:4px }
  input,select,button{ width:100%; border:1px solid var(--border); border-radius:10px;
                       padding:10px; font-size:14px; outline:none; }
  input:focus,select:focus{ border-color:#9dd9c7; box-shadow:0 0 0 3px rgba(13,107,58,.12) }
  button{ background:var(--green); color:#fff; border:none; font-weight:800; cursor:pointer }
  button.secondary{ background:#fff; color:var(--green); border:2px solid var(--green) }
  .controls{ display:flex; gap:8px; margin-top:8px }
  .section-title{ font-size:13px; font-weight:900; letter-spacing:.02em; margin:2px 0 6px }
  .scroll{ flex:1; min-height:0; overflow:auto; padding-right:4px }
  .result{ border:1px dashed #cfd8d3; border-radius:10px; padding:8px; background:#fafcfa; font-size:13px; }
  .pills{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px }
  .pill{ background:#e7f5ee; color:#0a5a2d; font-weight:800; font-size:11px; padding:6px 8px; border-radius:999px }
  .meals{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px }
  .meal{ border:1px solid #eef2ef; border-radius:10px; padding:8px; font-size:12px }
  .meal ul{ margin:6px 0 0 14px; padding:0 }
  .footer-actions{ display:flex; gap:8px; margin-top:8px }
  .fine{ font-size:11px; color:#667085; margin-top:6px }
  .tiny{ font-size:10px; color:#7a7f85 }
</style>
</head>
<body>
  <div class="viewport">
    <div class="brand">
      <a href="https://www.thekenkolife.com" target="_blank">
        <img src="kenko-logo.png" alt="The Kenko Life">
      </a>
    </div>

    <div class="card">
      <div class="scroll">
        <div class="section-title">Your details</div>
        <div class="row3">
          <div><label>Name</label><input id="name" placeholder="Your name"></div>
          <div><label>Mobile</label><input id="phone" placeholder="+91xxxxxxxxxx"></div>
          <div><label>Preference</label>
            <select id="pref"><option value="veg">Veg</option><option value="nonveg">Non-Veg</option></select>

        <div class="row3">
          <div><label>Height (cm)</label><input id="height" type="number" min="120" max="220" placeholder="170"></div>
          <div><label>Weight (kg)</label><input id="weight" type="number" min="35" max="160" placeholder="70"></div>
          <div><label>Age</label><input id="age" type="number" min="14" max="80" placeholder="28"></div>
          <div><label>Sex</label>

          </div>

            <select id="activity">
              <option value="1.2">Sedentary</option>
              <option value="1.375">Light (1–3x/wk)</option>
              <option value="1.55">Moderate (3–5x/wk)</option>
              <option value="1.725">Intense (6–7x/wk)</option>
            </select>
          </div>
          <div>
            <label>Goal</label>
            <select id="goal">
              <option value="loss">Weight loss</option>

          <div class="meals">
            <div class="meal"><strong>Breakfast</strong><ul id="b_items"></ul><div id="b_totals"></div></div>
            <div class="meal"><strong>Lunch</strong><ul id="l_items"></ul><div id="l_totals"></div></div>
            <div class="meal"><strong>Snack</strong><ul id="s_items"></ul><div id="s_totals"></div></div>
            <div class="meal"><strong>Dinner</strong><ul id="d_items"></ul><div id="d_totals"></div></div>

      <div class="footer-actions">

        <a id="callUs" href="tel:+916366946047"><button class="secondary">Call Us</button></a>
      </div>
      <div class="tiny">© The Kenko Life</div>
    </div>
  </div>

<script>
/* ---------- Macro DB (per 100g cooked unless perunit) ---------- */
const MACRO_DB = {
  rice_cooked:{mode:'per100',p:2.7,c:28,f:0.3,k:130},
  dal_cooked:{mode:'per100',p:9.0,c:20,f:1.0,k:116},
  veg_mix:{mode:'per100',p:2.0,c:8,f:3.0,k:80},
  roti:{mode:'perunit',p:3.0,c:20,f:3.0,k:120,unit_weight_g:50},
  paneer:{mode:'per100',p:18.0,c:3.0,f:20.0,k:265},
  tofu_firm:{mode:'per100',p:8.0,c:2.0,f:5.0,k:95},
  chicken_breast_ckd:{mode:'per100',p:31.0,c:0.0,f:3.6,k:165},
  fish_ckd:{mode:'per100',p:22.0,c:0.0,f:6.0,k:160},
  egg_white:{mode:'perunit',p:3.6,c:0.2,f:0.05,k:17,unit_weight_g:33},
  egg_whole:{mode:'perunit',p:6.0,c:0.4,f:5.0,k:72,unit_weight_g:50},
  greek_yogurt:{mode:'per100',p:10.0,c:4.0,f:0.4,k:59},
  oats_dry:{mode:'per100',p:13.0,c:68,f:7.0,k:379},
  whey_scoop:{mode:'perunit',p:24.0,c:2.0,f:2.0,k:120,unit_weight_g:30},
  almonds:{mode:'per100',p:21.0,c:22,f:50.0,k:579},
  bread_slice:{mode:'perunit',p:3.5,c:12,f:1.0,k:66,unit_weight_g:25},
  banana:{mode:'per100',p:1.1,c:23,f:0.3,k:96}
};

/* Name→key map for trimming */
const NAME_KEY = {
  'Jeera rice':'rice_cooked','Rice':'rice_cooked',
  'Roti':'roti',
  'Bread':'bread_slice',
  'Fruit (banana)':'banana',
  'Almonds':'almonds'
};
const NAME_UNIT = {
  'Jeera rice':'g','Rice':'g',
  'Roti':'unit',
  'Bread':'unit',
  'Fruit (banana)':'g',
  'Almonds':'g'
};

/* ---------- utils ---------- */
const roundTo = (n, step=1) => Math.round(n/step)*step;
const round10 = n => roundTo(n,10);
const round5  = n => roundTo(n,5);

function macroOf(key, qty, unit='g'){
  const m = MACRO_DB[key]; if(!m) return {p:0,c:0,f:0,k:0};
  if(m.mode==='per100'){
    const f = (qty||0)/100;
    return { p:m.p*f, c:m.c*f, f:m.f*f, k:m.k*f };
  }
  const units = unit==='unit' ? (qty||0) : (qty||0)/(m.unit_weight_g||1);
  return { p:m.p*units, c:m.c*units, f:m.f*units, k:m.k*units };
}
function sum(a,b){ return {p:a.p+b.p, c:a.c+b.c, f:a.f+b.f, k:a.k+b.k}; }
function gramsForProtein(key, target_p_g){
  const m = MACRO_DB[key]; if(!m) return 0;
  if(m.mode==='per100'){
    const g = Math.max(0, (target_p_g / (m.p||1)) * 100);
    return round5(g);
  }
  const units = Math.ceil(target_p_g / (m.p||1));
  return (m.unit_weight_g||0) * units; // units already whole
}

function makeItem(name, key, qtyNum, unit='g'){
  qtyNum = (unit==='unit') ? Math.max(0, Math.round(qtyNum)) : round5(Math.max(0, qtyNum));
  const m = macroOf(key, qtyNum, unit);
  const qtyText = (unit==='unit')
      ? String(qtyNum) + (name==='Bread' ? ' slices' : '')
      : `${qtyNum} g`;
  return { name, key, unit, qtyNum, qtyText, m };
}
function recalcItem(it){
  it.qtyNum = (it.unit==='unit') ? Math.max(0, Math.round(it.qtyNum)) : round5(Math.max(0, it.qtyNum));
  it.m = macroOf(it.key, it.qtyNum, it.unit);
  it.qtyText = (it.unit==='unit') ? String(it.qtyNum) + (it.name==='Bread' ? ' slices' : '') : `${it.qtyNum} g`;
}

function totals(items){
  const tot = arr => arr.reduce((acc, it)=>sum(acc, it.m), {p:0,c:0,f:0,k:0});
  const tb = tot(items.b), tl = tot(items.l), ts = tot(items.s), td = tot(items.d);
  return { tb, tl, ts, td, day: { p:tb.p+tl.p+ts.p+td.p, c:tb.c+tl.c+ts.c+td.c, f:tb.f+tl.f+ts.f+td.f, k:tb.k+tl.k+ts.k+td.k } };
}

/* Trim/add helpers (adjust selected high-calorie items by steps) */
function adjust(items, mealKey, itemName, delta){
  const key = NAME_KEY[itemName]; const unit = NAME_UNIT[itemName];
  const arr = items[mealKey];
  const idx = arr.findIndex(x => x.name === itemName);
  if(idx === -1) return false;
  const it = arr[idx];
  it.qtyNum = it.qtyNum + delta;
  // floors so we don't go to weird values
  if(itemName==='Jeera rice' || itemName==='Rice') it.qtyNum = Math.max(50, it.qtyNum);
  if(itemName==='Roti') it.qtyNum = Math.max(0, it.qtyNum);
  if(itemName==='Bread') it.qtyNum = Math.max(0, it.qtyNum);
  if(itemName==='Fruit (banana)' || itemName==='Almonds') it.qtyNum = Math.max(0, it.qtyNum);
  recalcItem(it);
  return true;
}

/* Balance to target kcal by adding OR trimming */
function balanceCaloriesToTarget(pref, items, targetKcal){
  const threshold = 75; // aim window
  let { day } = totals(items);
  let gap = Math.round(targetKcal - day.k);
  let safety = 0;

  // Steps to add calories
  const addSteps = (pref === 'veg')
    ? [
        ()=>adjust(items,'l','Jeera rice', 50),
        ()=>adjust(items,'d','Roti', 1),
        ()=>adjust(items,'b','Fruit (banana)', 100),
        ()=>adjust(items,'s','Almonds', 10),
        ()=>adjust(items,'l','Jeera rice', 50),
        ()=>adjust(items,'b','Bread', 1),
      ]
    : [
        ()=>adjust(items,'l','Rice', 50),
        ()=>adjust(items,'d','Roti', 1),
        ()=>adjust(items,'b','Fruit (banana)', 100),
        ()=>adjust(items,'b','Bread', 1),
        ()=>adjust(items,'s','Almonds', 10),
      ];

  // Steps to trim calories (reverse order of energy density)
  const trimSteps = [
    ()=>adjust(items,'s','Almonds', -10),
    ()=>adjust(items,'b','Fruit (banana)', -100),
    ()=>adjust(items,'b','Bread', -1),
    ()=>adjust(items,'d','Roti', -1),
    ()=>adjust(items,'l', pref==='veg' ? 'Jeera rice':'Rice', -50),
  ];

  let addIdx=0, trimIdx=0;
  while (Math.abs(gap) > threshold && safety < 100) {
    if (gap > threshold) { // under target -> add
      const ok = addSteps[addIdx % addSteps.length]();
      addIdx++;
    } else { // over target -> trim
      const ok = trimSteps[trimIdx % trimSteps.length]();
      trimIdx++;
    }
    day = totals(items).day;
    gap = Math.round(targetKcal - day.k);
    safety++;
  }
}

/* ---------- SheetDB (no email) ---------- */
function saveLead(obj) {
  const payload = {
    ts_recv: new Date().toISOString(),
    name: obj.name, phone: obj.phone, pref: obj.pref,
    height: obj.height, weight: obj.weight, age: obj.age, sex: obj.sex,
    activity: obj.activity, TDEE_base: obj.TDEE_base, TDEE_target: obj.TDEE_target,
    goal: obj.goal, p: obj.p, c: obj.c, f: obj.f, ts_raw: obj.ts
  };
  fetch("https://sheetdb.io/api/v1/z8t6n6g32sh56", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ data: [payload] })
  })
  .then(res => console.log("Saved to SheetDB:", res.status))
  .catch(err => console.error("SheetDB save failed:", err));
}

/* ---------- main ---------- */
function run(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const pref = document.getElementById('pref').value;
  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);
  const age = parseFloat(document.getElementById('age').value || "28");
  const sex = document.getElementById('sex').value || "male";
  const act = parseFloat(document.getElementById('activity').value);
  const goal = document.getElementById('goal').value;

  if(!name || !phone){ alert("Please fill name and mobile."); return; }
  if(!(h>0 && w>0)){ alert("Enter valid height and weight."); return; }

  // Base TDEE
  const BMR  = 10*w + 6.25*h - 5*age + (sex==="male" ? 5 : -161);
  const TDEE_base_raw = Math.max(1200, (BMR * act) * 0.9);
  const TDEE_base = round10(TDEE_base_raw);

  // Adjust for goal (hidden percentages)
  let TDEE_target_raw = TDEE_base_raw;
  if(goal === 'loss') TDEE_target_raw = TDEE_base_raw * 0.85;     // -15%
  else if(goal === 'gain') TDEE_target_raw = TDEE_base_raw * 1.12; // +12%
  const TDEE_target = round10(TDEE_target_raw);

  // Protein target (kept independent of goal)
  const protein_target = Math.round(w * (sex==="male" ? 2.0 : 1.6));

  // Protein split
  const p_b = Math.round(protein_target * 0.25);
  const p_l = Math.round(protein_target * 0.35);
  const p_s = 25;
  const p_d = Math.max(0, protein_target - (p_b + p_l + p_s));

  const items = { b:[], l:[], s:[], d:[] };

  if(pref === "veg"){
    // Breakfast
    const b1 = makeItem('Oats (dry)','oats_dry', 50,'g');
    const b2 = makeItem('Greek yogurt','greek_yogurt', 150,'g');
    const paneer_g = gramsForProtein('paneer', Math.max(0, p_b - (b1.m.p + b2.m.p)));
    const b3 = makeItem('Paneer','paneer', paneer_g,'g');
    items.b = [ b1, b2, b3 ];

    // Lunch
    const l1 = makeItem('Jeera rice','rice_cooked', 150,'g');
    const l2 = makeItem('Dal','dal_cooked', 200,'g');
    const paneer_l_g = gramsForProtein('paneer', Math.max(0, p_l - (l1.m.p + l2.m.p)));
    const l3 = makeItem('Paneer (grilled)','paneer', paneer_l_g,'g');
    items.l = [ l1, l2, l3 ];

    // Snack
    const s1 = makeItem('Whey protein','whey_scoop', 1,'unit');
    const s2 = makeItem('Almonds','almonds', 15,'g');
    items.s = [ s1, s2 ];

    // Dinner
    const d1 = makeItem('Roti','roti', 2,'unit');
    const d3 = makeItem('Sautéed veg','veg_mix', 150,'g');
    const tofu_g = gramsForProtein('tofu_firm', Math.max(0, p_d - (d1.m.p + d3.m.p)));
    const d2 = makeItem('Tofu','tofu_firm', tofu_g,'g');
    items.d = [ d1, d2, d3 ];
  } else {
    // Breakfast
    const b1 = makeItem('Egg whites','egg_white', 4,'unit');
    const b2 = makeItem('Egg (whole)','egg_whole', 1,'unit');
    const b3 = makeItem('Bread','bread_slice', 2,'unit');
    const b4 = makeItem('Fruit (banana)','banana', 100,'g');
    items.b = [ b1, b2, b3, b4 ];

    // Lunch
    const l1 = makeItem('Rice','rice_cooked', 150,'g');
    const l3 = makeItem('Veg','veg_mix', 100,'g');
    const chicken_l_g = gramsForProtein('chicken_breast_ckd', Math.max(0, p_l - (l1.m.p + l3.m.p)));
    const l2 = makeItem('Grilled chicken','chicken_breast_ckd', chicken_l_g,'g');
    items.l = [ l1, l2, l3 ];

    // Snack
    const s1 = makeItem('Whey protein','whey_scoop', 1,'unit');
    items.s = [ s1 ];

    // Dinner
    const d1 = makeItem('Roti','roti', 2,'unit');
    const d3 = makeItem('Veg','veg_mix', 150,'g');
    const chicken_d_g = gramsForProtein('chicken_breast_ckd', Math.max(0, p_d - (d1.m.p + d3.m.p)));
    const d2 = makeItem('Chicken (lean curry)','chicken_breast_ckd', chicken_d_g,'g');
    items.d = [ d1, d2, d3 ];
  }

  // Balance to goal-adjusted target (add OR trim)
  balanceCaloriesToTarget(pref, items, TDEE_target);

  // Tally & render
  const { tb, tl, ts, td, day } = totals(items);

  const li = it => `<li>${it.name} — ${it.qtyText} (~${Math.round(it.m.p)}P / ${Math.round(it.m.c)}C / ${Math.round(it.m.f)}F)</li>`;
  document.getElementById('b_items').innerHTML = items.b.map(li).join('');
  document.getElementById('l_items').innerHTML = items.l.map(li).join('');
  document.getElementById('s_items').innerHTML = items.s.map(li).join('');
  document.getElementById('d_items').innerHTML = items.d.map(li).join('');

  document.getElementById('b_totals').innerHTML = `<div class="tiny">Total: ${Math.round(tb.p)}P / ${Math.round(tb.c)}C / ${Math.round(tb.f)}F · ${round10(tb.k)} kcal</div>`;
  document.getElementById('l_totals').innerHTML = `<div class="tiny">Total: ${Math.round(tl.p)}P / ${Math.round(tl.c)}C / ${Math.round(tl.f)}F · ${round10(tl.k)} kcal</div>`;
  document.getElementById('s_totals').innerHTML = `<div class="tiny">Total: ${Math.round(ts.p)}P / ${Math.round(ts.c)}C / ${Math.round(ts.f)}F · ${round10(ts.k)} kcal</div>`;
  document.getElementById('d_totals').innerHTML = `<div class="tiny">Total: ${Math.round(td.p)}P / ${Math.round(td.c)}C / ${Math.round(td.f)}F · ${round10(td.k)} kcal</div>`;

  const goalText = (goal==='loss') ? 'Weight loss'
                   : (goal==='gain') ? 'Gain'
                   : 'Maintain';
  document.getElementById('summary').innerText =
    `${name}, base TDEE ~${TDEE_base} kcal → target ~${TDEE_target} kcal (${goalText}) | Protein ${protein_target} g/day.`;
  document.getElementById('macroPills').innerHTML =
    `<div class="pill">Day total (calc): ${round10(day.k)} kcal</div>
     <div class="pill">P: ${Math.round(day.p)} g</div>
     <div class="pill">C: ${Math.round(day.c)} g</div>
     <div class="pill">F: ${Math.round(day.f)} g</div>`;
  document.getElementById('day_totals').innerText =
    `Meals are calibrated to stay within approximately ±75 kcal of your target, based on the Mifflin–St Jeor equation.
Please note, this plan is an estimate for a precise and personalized assessment, we recommend speaking with our nutritionists by clicking the Next button below`;

  // Save
  saveLead({
    name, phone, pref,
    height:h, weight:w, age, sex, activity:act,
    TDEE_base, TDEE_target, goal,
    p: Math.round(day.p), c: Math.round(day.c), f: Math.round(day.f),
    ts: new Date().toISOString()
  });

  document.getElementById('results').style.display = "";
}

function clearAll(){
  ['name','phone','height','weight','age'].forEach(id=>document.getElementById(id).value="");
  document.getElementById('pref').value="veg";
  document.getElementById('sex').value="male";
  document.getElementById('activity').value="1.2";
  document.getElementById('goal').value="maintain";
  document.getElementById('results').style.display="none";
}
function openPromo(){
  if(document.getElementById('results').style.display === ''){
    document.getElementById('promoOverlay').style.display='flex';
  }else{
    alert('Please get your plan first.');
  }
}
function closePromo(){ document.getElementById('promoOverlay').style.display='none'; }
</script>

  <div style="background:#fff;border-radius:14px;max-width:420px;width:92%;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;">
    <img src="promoimage.png" alt="Kenko Meal Plans" style="width:100%;height:auto;border-radius:10px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="https://www.thekenkolife.com/onboarding-form" target="_blank" style="flex:1">
        <button style="width:100%">Visit Site</button>
      </a>
      <a href="tel:+916366946047" style="flex:1">
        <button class="secondary" style="width:100%">Call Us</button>
      </a>
    </div>
    <button class="secondary" onclick="closePromo()">Close</button>
  </div>
</div>

</body>
